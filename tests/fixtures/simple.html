<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Perfect fixture — simple</title>
</head>
<body>
  <h1>Perfect Test Page</h1>
  <p>Counter: <span id="count">0</span></p>
  <button id="inc" type="button">Increment</button>
  <form id="f">
    <label>Name <input id="name" name="name" /></label>
    <button type="submit">Submit</button>
  </form>
  <p id="out"></p>
  <script>
    document.getElementById('inc').onclick = () => {
      const el = document.getElementById('count');
      el.textContent = String(Number(el.textContent) + 1);
    };
    document.getElementById('f').onsubmit = (e) => {
      e.preventDefault();
      document.getElementById('out').textContent = 'Hello ' + document.getElementById('name').value;
    };
  </script>
</body>
</html>
