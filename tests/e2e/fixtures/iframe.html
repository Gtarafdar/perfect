<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Perfect E2E — Iframe parent</title>
  <style>body { font-family: system-ui; margin: 24px; } iframe { width: 100%; height: 280px; border: 1px solid #ccc; }</style>
</head>
<body>
  <h1>Parent page</h1>
  <button id="parent-btn">Parent action</button>
  <!-- srcdoc keeps same-origin (file:// sibling files are cross-origin) -->
  <iframe id="child-frame" title="child" srcdoc='<!DOCTYPE html><html><body>
    <h2>Inside iframe</h2>
    <label>Child name <input id="child-name" name="child-name" /></label>
    <button id="child-btn">Child button</button>
    <p id="child-status">idle</p>
    <script>
      document.getElementById("child-btn").onclick = function () {
        document.getElementById("child-status").textContent = "clicked";
      };
    </script>
  </body></html>'></iframe>
</body>
</html>
