<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Perfect E2E — Flip</title>
  <style>
    body { font-family: system-ui; margin: 40px; }
    .flip { width: 220px; height: 120px; perspective: 600px; }
    .inner { width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; position: relative; }
    .flip.open .inner { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #333; border-radius: 8px; }
    .back { transform: rotateY(180deg); background: #b8ff3c; color: #0a0b0a; }
  </style>
</head>
<body>
  <h1>Flip box</h1>
  <div class="flip" id="flip">
    <div class="inner">
      <div class="face front">Front</div>
      <div class="face back" id="flip-back">Back side</div>
    </div>
  </div>
  <button id="flip-btn">Flip</button>
  <script>
    document.getElementById('flip-btn').onclick = () => {
      document.getElementById('flip').classList.toggle('open');
    };
  </script>
</body>
</html>
